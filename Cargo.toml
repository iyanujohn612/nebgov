[workspace]
members = [
    "contracts/governor",
    "contracts/timelock",
    "contracts/token-votes",
    "contracts/governor-factory",
    "contracts/treasury",
    "contracts/liquidity",
    "contracts/token-votes-wrapper",
    "contracts/co-sponsorship",
    "contracts/vote-escrow",
    "contracts/conviction-voting",
    "contracts/signal-anchor",
    "contracts/proposal-bonds",
    "contracts/treasury-strategies",
    "contracts/treasury-streams",
    "contracts/optimistic-governor",
    "contracts/voting-rewards",
    "contracts/guardian-council",
]
exclude = ["fuzz", "tools/sim"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "22.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
